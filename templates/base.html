<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}SIMEDIC - Mantenimiento{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('admin_lista') }}" class="brand">SIMEDIC · Mantenimiento</a>
  </header>
  <main class="contenedor">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% if mensajes %}
        {% for categoria, msg in mensajes %}
          <div class="alerta alerta-{{ categoria }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
